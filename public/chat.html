<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>PrivChat — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030518;--muted:#ffffff;--accent:#7c5cff;--accent2:#3ddc97}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;height:100vh;height:100dvh;background:linear-gradient(180deg,#030518,#071023);color:#eaf3fb;display:flex;flex-direction:column;overflow:hidden;-webkit-overflow-scrolling:touch}
.top{height:64px;display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.03);flex-shrink:0}
.logo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101a;font-weight:800}
.layout{display:flex;flex:1;gap:16px;padding:16px;overflow:hidden;min-height:0}
.sidebar{width:300px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chatWindow{display: flex; flex-direction: column;flex:1;background:rgba(255,255,255,0.02);border-radius:20px;padding:14px;overflow-y:auto;overflow-x:hidden;border:1px solid rgba(255,255,255,0.03);scroll-behavior:smooth;-webkit-overflow-scrolling:touch;min-height:0}
.msgWrapper{display:flex;align-items:center;gap:6px;margin-bottom:8px; position: relative; touch-action: pan-y;}
.msgWrapper.me{flex-direction:row-reverse}
.msg {display: block; width: fit-content; max-width: 78%;padding: 10px 14px;border-radius: 20px;background: rgba(255, 255, 255, 0.05);word-wrap: break-word;overflow-wrap:break-word}
.msg.me {background: linear-gradient(90deg, var(--accent), var(--accent2));color: #04101a;font-weight: 700;}

/* Kebab Button (Three dots vertical) */
.kebabBtn {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  opacity: 0;
  transition: opacity 0.2s;
  align-self: center;
  line-height: 1;
  z-index: 10;
}
/* Ensure the button aligns correctly for our messages, which are right-aligned */
.msgWrapper.me .kebabBtn {
  align-self: flex-start;
}

/* Show kebab button on hover (desktop) */
.msgWrapper:hover .kebabBtn {
  opacity: 1;
}

.replyBox{background:rgba(255,255,255,0.08);border-left:3px solid var(--accent);padding:6px 10px;margin-bottom:6px;border-radius:8px;font-size:12px}
.replyBox .replySender{color:#ffffff;font-weight:600;margin-bottom:2px}
.replyBox .replyText{color:#eaf3fb;opacity:0.9}
.replyPreview{background:rgba(124,92,255,0.15);border-left:3px solid var(--accent);padding:8px 12px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.replyPreview .replyInfo{flex:1}
.replyPreview .replySender{color:var(--accent);font-weight:600;font-size:12px}
.replyPreview .replyText{color:var(--muted);font-size:12px;margin-top:2px;opacity:0.8}
.replyPreview .cancelReply{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.composer{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.03);flex-shrink:0;min-height:50px;flex-direction:column}
input[type="text"]{flex:1;padding:10px;border-radius:45px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit;font-size:15px;min-width:0;-webkit-appearance:none}
input[type="text"]:focus{outline:none;border-color:rgba(124,92,255,0.5)}
.btn{padding:10px 12px;border-radius:45px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04101a;cursor:pointer;white-space:nowrap}
.small{font-size:13px;color:var(--muted)}
#typingIndicator{font-size:13px;color:var(--muted);margin:6px 0 0 4px;font-style:italic;flex-shrink:0}
#mobileMenu{display:none;background:transparent;border:none;padding:10px;cursor:pointer;flex-direction:column;gap:4px;justify-content:center;align-items:center;width:40px;height:40px}
#mobileMenu span{display:block;width:24px;height:2px;background:var(--muted);border-radius:2px}
#mobilePanel{position:fixed;top:0;right:-100%;width:300px;height:100vh;background:linear-gradient(180deg,#030518,#071023);border-left:1px solid rgba(255,255,255,0.1);padding:20px;transition:right 0.3s ease;z-index:1000;overflow-y:auto}
#mobilePanel.open{right:0}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 0.3s ease;z-index:999}
#overlay.open{opacity:1;pointer-events:all}

.memberItem {
  display: flex;
  align-items: center;
  margin-top: 5px;
  font-size: 13px;
  color: var(--muted);
}
.statusCircle {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4545;
  margin-right: 7px;
  flex-shrink: 0;
}
.statusCircle.online {
  background: var(--accent2);
}

/* Context Menu Panel Styling */
.msgPanel {
  position: fixed;
  bottom: -300px;
  left: 0;
  right: 0;
  background: #0f1c3a;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 2000;
  transition: bottom 0.3s ease-out;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
}

.msgPanel.open {
  bottom: 0;
}

.msgPanel button {
  display: block;
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.1);
  color: var(--muted);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  font-size: 15px;
}

.msgPanel button:last-child {
  margin-bottom: 0;
}

@media (max-width: 768px) {
  .sidebar{display:none}
  .layout{padding:8px;padding-bottom:env(safe-area-inset-bottom, 8px)}
  .chatWindow{border-radius:12px;max-height:calc(100vh - 180px);max-height:calc(100dvh - 180px)}
  #mobileMenu{display:flex}
  #groupInfo{display:none}
  .main{padding-bottom:env(safe-area-inset-bottom, 8px)}
  .composer{padding-bottom:max(8px, env(safe-area-inset-bottom))}
  /* Mobile-specific changes for the kebab button (always visible) */
  .msgWrapper .kebabBtn {
    opacity: 1;
  }
  .msgWrapper:hover .replyBtn{opacity:0}
  .msgWrapper{position:relative;touch-action:pan-y}
}
</style>
</head>
<body>
<div class="top">
  <button id="mobileMenu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="logo" style="margin-left:8px">PC</div>
  <div style="font-weight:700;margin-left:8px">PrivChat</div>
  <div id="groupInfo" class="small" style="margin-left:auto;margin-right:12px">loading...</div>
  <button id="backBtn" class="btn" style="margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)">Back</button>
</div>

<div id="overlay"></div>
<div id="mobilePanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <strong style="font-size:18px">Menu</strong>
    <button id="closePanel" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 12px">✕</button>
  </div>
  <div><strong>You</strong></div>
  <div id="meInfoMobile" class="small" style="margin-top:6px"></div>
  <div style="margin-top:12px"><strong>Group</strong></div>
  <div id="groupMetaMobile" class="small" style="margin-top:6px"></div>
  <div style="margin-top:14px"><button id="notifBtn" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);width:100%;margin-bottom:8px">Enable Notifications</button></div>
  <div style="margin-top:6px"><button id="leaveBtnMobile" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);width:100%">Leave group</button></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div><strong>You</strong></div>
    <div id="meInfo" class="small" style="margin-top:6px"></div>
    <div style="margin-top:12px"><strong>Group</strong></div>
    <div id="groupMeta" class="small" style="margin-top:6px"></div>
    <div style="margin-top:14px"><button id="notifBtnDesktop" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);width:100%;margin-bottom:8px">Enable Notifications</button></div>
    <div style="margin-top:6px"><button id="leaveBtn" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)">Leave group</button></div>
  </div>

  <div class="main">
    <div id="chatWindow" class="chatWindow"></div>
    <div id="typingIndicator"></div>
    <div class="composer">
      <div id="replyPreviewContainer"></div>
      <div style="display:flex;gap:8px">
        <input type="text" id="msgInput" placeholder="Message…" autocomplete="off"/>
        <button id="sendBtn" class="btn">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="messagePanel" class="msgPanel">
  <strong id="panelMessageText" style="display:block; margin-bottom:10px; font-size:14px; opacity:0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></strong>
  <button id="panelReplyBtn">↩ Reply</button>
  <button id="panelDeleteBtn" style="color: #ff4545; background: rgba(255,69,69,0.1); display:none;">🗑 Delete</button>
  <button id="panelCancelBtn" style="margin-top:10px; background: rgba(255,255,255,0.05);">Cancel</button>
</div>
<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC3mxKk2jM2ppVRd75p84QoHaZkmmhmNXE",
  authDomain: "privchat0.firebaseapp.com",
  projectId: "privchat0",
  storageBucket: "privchat0.firebasestorage.app",
  messagingSenderId: "679595145265",
  appId: "1:679595145265:web:f9ab2bc210deb637e37d10"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const username = localStorage.getItem('priv_username');
const displayName = localStorage.getItem('priv_displayName') || username;
if(!username){ alert('Not signed in'); window.location='index.html'; }

const urlParams = new URLSearchParams(location.search);
const groupId = (urlParams.get('group') || localStorage.getItem('priv_group') || '').toUpperCase();
if(!/^[A-Z0-9]{5}$/.test(groupId)){ alert('Invalid group id'); window.location='app.html'; }

const groupRef = db.collection('groups').doc(groupId);
const membersRef = groupRef.collection('members');
const presenceRef = groupRef.collection('presence');
let groupMembers = {};

document.getElementById('meInfo').textContent = `${displayName} (${username})`;
document.getElementById('meInfoMobile').textContent = `${displayName} (${username})`;
document.getElementById('groupInfo').textContent = `Group: ${groupId}`;
document.getElementById('backBtn').onclick = ()=> window.location='app.html';

// Mobile panel controls
const mobilePanel = document.getElementById('mobilePanel');
const overlay = document.getElementById('overlay');
document.getElementById('mobileMenu').onclick = ()=>{
  mobilePanel.classList.add('open');
  overlay.classList.add('open');
};
document.getElementById('closePanel').onclick = ()=>{
  mobilePanel.classList.remove('open');
  overlay.classList.remove('open');
};
overlay.onclick = ()=>{
  mobilePanel.classList.remove('open');
  overlay.classList.remove('open');
};

// Leave group handlers
async function leaveGroup(){
  await groupRef.update({ members: firebase.firestore.FieldValue.arrayRemove(username) });
  await membersRef.doc(username).delete().catch(console.error);
  await presenceRef.doc(username).delete().catch(console.error);
  localStorage.removeItem('priv_group');
  window.location='app.html';
}
document.getElementById('leaveBtn').onclick = leaveGroup;
document.getElementById('leaveBtnMobile').onclick = leaveGroup;

// Notification handlers
let notificationsEnabled = false;
let groupName = '';
let lastMessageCount = 0;

async function toggleNotifications() {
  if (!("Notification" in window)) {
    alert("This browser does not support notifications");
    return;
  }

  if (notificationsEnabled) {
    notificationsEnabled = false;
    document.getElementById('notifBtn').textContent = 'Enable Notifications';
    document.getElementById('notifBtn').style.color = 'var(--muted)';
    document.getElementById('notifBtnDesktop').textContent = 'Enable Notifications';
    document.getElementById('notifBtnDesktop').style.color = 'var(--muted)';
  } else {
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      notificationsEnabled = true;
      document.getElementById('notifBtn').textContent = 'Disable Notifications';
      document.getElementById('notifBtn').style.color = 'var(--accent2)';
      document.getElementById('notifBtnDesktop').textContent = 'Disable Notifications';
      document.getElementById('notifBtnDesktop').style.color = 'var(--accent2)';
      
      new Notification("Notifications Enabled", {
        body: `You will now receive notifications from ${groupName || 'this group'} (${groupId})`,
        icon: 'https://via.placeholder.com/128/7c5cff/ffffff?text=PC'
      });
    } else {
      alert("Notification permission denied");
    }
  }
}

document.getElementById('notifBtn').onclick = toggleNotifications;
document.getElementById('notifBtnDesktop').onclick = toggleNotifications;

// ====== CHAT CORE WITH REPLY & NEW MESSAGE MENU ======
const chatWindow = document.getElementById('chatWindow');
const input = document.getElementById('msgInput');
const typingIndicator = document.getElementById('typingIndicator');
const replyPreviewContainer = document.getElementById('replyPreviewContainer');

// Panel element references and state
const messagePanel = document.getElementById('messagePanel');
const panelMessageText = document.getElementById('panelMessageText');
const panelReplyBtn = document.getElementById('panelReplyBtn');
const panelDeleteBtn = document.getElementById('panelDeleteBtn');
const panelCancelBtn = document.getElementById('panelCancelBtn');
let selectedMsgData = null; // Stores {id, sender, displayName, text} for the currently selected message

// Helper function to close the panel
function closePanel() {
  messagePanel.classList.remove('open');
  selectedMsgData = null;
}
panelCancelBtn.onclick = closePanel;

// Handler for the reply button inside the panel
panelReplyBtn.onclick = () => {
  if (selectedMsgData) {
    setReply(selectedMsgData);
  }
  closePanel();
};

// Handler for the delete button inside the panel
panelDeleteBtn.onclick = async () => {
  if (!selectedMsgData || selectedMsgData.sender !== username) return;

  // Simple confirmation before deleting
  if (confirm(`Are you sure you want to delete this message from ${selectedMsgData.displayName}?`)) {
    try {
      await groupRef.collection('messages').doc(selectedMsgData.id).delete();
      // Firestore listener will automatically update the chat window
    } catch (err) {
      console.error('Delete failed:', err);
      alert('Failed to delete message. Check console for details.');
    }
  }
  closePanel();
};

// Function to handle showing the menu panel
function showPanel(msgData) {
  selectedMsgData = msgData;
  panelMessageText.textContent = `${msgData.displayName}: ${msgData.text.length > 50 ? msgData.text.substring(0, 50) + '...' : msgData.text}`;
  
  // Show delete option only for own messages
  if (msgData.sender === username) {
    panelDeleteBtn.style.display = 'block';
  } else {
    panelDeleteBtn.style.display = 'none';
  }
  
  messagePanel.classList.add('open');
}

// Ensure the panel closes if clicking elsewhere (except the kebab button)
document.addEventListener('click', (e) => {
  if (messagePanel.classList.contains('open') && !e.target.closest('.kebabBtn') && !e.target.closest('.msgPanel')) {
    closePanel();
  }
});


let replyingTo = null; // Stores {id, sender, displayName, text}

function el(tag, cls=''){const e=document.createElement(tag); if(cls) e.className=cls; return e;}

function appendMessage(msgData, msgId){
  const isMe = msgData.sender === username;
  const wrapper = el('div', 'msgWrapper' + (isMe ? ' me' : ''));
  wrapper.dataset.msgId = msgId;
  wrapper.dataset.sender = msgData.sender;
  wrapper.dataset.displayName = msgData.displayName || msgData.sender;
  wrapper.dataset.text = msgData.text;
  
  const msg = el('div','msg' + (isMe ? ' me' : ''));
  const meta = el('div','meta'); 
  meta.textContent = `${msgData.displayName || msgData.sender} • ${msgData.ts && msgData.ts.toDate ? msgData.ts.toDate().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : ''}`;
  
  // If this message is a reply, show the reply box
  if(msgData.replyTo) {
    const replyBox = el('div', 'replyBox');
    const replySender = el('div', 'replySender');
    replySender.textContent = msgData.replyTo.displayName || msgData.replyTo.sender;
    const replyText = el('div', 'replyText');
    replyText.textContent = msgData.replyTo.text;
    replyBox.append(replySender, replyText);
    msg.appendChild(replyBox);
  }
  
  const body = el('div'); 
  body.textContent = msgData.text;
  msg.append(meta, body);
  
  // Kebab Menu Button (Three dots vertical)
  const kebabBtn = el('button', 'kebabBtn');
  kebabBtn.textContent = '⋮';
  kebabBtn.onclick = (e) => {
    e.stopPropagation(); 
    showPanel({
      id: msgId,
      sender: msgData.sender,
      displayName: msgData.displayName || msgData.sender,
      text: msgData.text,
      // Ensure we pass the ID for potential deletion
      id: msgId 
    });
  };

  // CORRECTED: Append elements based on if it's 'me' or 'other' for correct layout
  // If it's *our* message (right-aligned), the button must come first in the flex row
  // If it's *their* message (left-aligned), the button must come last
  if (isMe) {
    wrapper.append(kebabBtn, msg); 
  } else {
    wrapper.append(msg, kebabBtn); 
  }

  
  // Touch swipe for mobile (now opens the panel)
  let touchStartX = 0;
  let touchCurrentX = 0;
  let isSwiping = false;
  
  wrapper.addEventListener('touchstart', (e) => {
    if (e.target.closest('.kebabBtn')) return; // Ignore if tapping the menu button
    touchStartX = e.touches[0].clientX;
    isSwiping = true;
  });
  
  wrapper.addEventListener('touchmove', (e) => {
    if (!isSwiping) return;
    touchCurrentX = e.touches[0].clientX;
    const diff = touchCurrentX - touchStartX;
    
    // Only swipe right for reply (moves message right)
    if (diff > 0 && diff < 100) {
      wrapper.style.transform = `translateX(${diff}px)`;
      wrapper.style.transition = 'none';
    }
  });
  
  wrapper.addEventListener('touchend', (e) => {
    if (!isSwiping) return;
    const diff = touchCurrentX - touchStartX;
    
    if (diff > 50) {
      // Show the menu panel on successful swipe
      showPanel({
        id: msgId,
        sender: msgData.sender,
        displayName: msgData.displayName || msgData.sender,
        text: msgData.text
      });
    }
    
    wrapper.style.transform = '';
    wrapper.style.transition = 'transform 0.2s ease';
    isSwiping = false;
    touchStartX = 0;
    touchCurrentX = 0;
  });
  
  chatWindow.appendChild(wrapper);
}

function setReply(msgData) {
  replyingTo = msgData;
  replyPreviewContainer.innerHTML = `
    <div class="replyPreview">
      <div class="replyInfo">
        <div class="replySender">Replying to ${msgData.displayName}</div>
        <div class="replyText">${msgData.text}</div>
      </div>
      <button class="cancelReply" onclick="cancelReply()">✕</button>
    </div>
  `;
  input.focus();
}

function cancelReply() {
  replyingTo = null;
  replyPreviewContainer.innerHTML = '';
}
window.cancelReply = cancelReply;

let autoScroll = true;
chatWindow.addEventListener('scroll', ()=>{
  const atBottom = chatWindow.scrollHeight - chatWindow.scrollTop - chatWindow.clientHeight < 30;
  autoScroll = atBottom;
});

// ---- Listen to messages ----
const msgsRef = groupRef.collection('messages').orderBy('ts','asc');
msgsRef.onSnapshot(snap=>{
  const shouldStick = autoScroll;
  const currentCount = snap.size;
  
  if (notificationsEnabled && lastMessageCount > 0 && currentCount > lastMessageCount) {
    const lastDoc = snap.docs[snap.docs.length - 1];
    const lastMsg = lastDoc.data();
    
    if (lastMsg.sender !== username) {
      new Notification(`New message in ${groupName} (${groupId})`, {
        body: `${lastMsg.displayName || lastMsg.sender}: ${lastMsg.text}`,
        icon: 'https://via.placeholder.com/128/7c5cff/ffffff?text=PC'
      });
    }
  }
  
  lastMessageCount = currentCount;
  
  chatWindow.innerHTML = '';
  snap.forEach(doc => appendMessage(doc.data(), doc.id));
  if(shouldStick) chatWindow.scrollTop = chatWindow.scrollHeight;
});

// ---- Typing indicator ----
const typingRef = groupRef.collection('typing');
let typingTimeout;
input.addEventListener('input', async ()=>{
  await typingRef.doc(username).set({
    user: displayName,
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=> typingRef.doc(username).delete().catch(()=>{}), 1500);
});

typingRef.onSnapshot(snap=>{
  const now = Date.now();
  const others = [];
  snap.forEach(doc=>{
    const data = doc.data();
    if(doc.id !== username && data.ts) {
      const tsMillis = data.ts.toMillis ? data.ts.toMillis() : data.ts.seconds * 1000;
      if(now - tsMillis < 2000) {
        others.push(data.user);
      }
    }
  });
  typingIndicator.textContent = others.length ? `${others.join(', ')} typing...` : '';
});

// ---- Send message ----
document.getElementById('sendBtn').onclick = sendMessage;
input.addEventListener('keydown', e => { 
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(); 
  }
});

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  const msgData = {
    sender: username,
    displayName,
    text,
    ts: firebase.firestore.FieldValue.serverTimestamp()
  };

  // Add reply data if replying
  if(replyingTo) {
    msgData.replyTo = {
      id: replyingTo.id,
      sender: replyingTo.sender,
      displayName: replyingTo.displayName,
      text: replyingTo.text
    };
  }

  input.value = '';
  cancelReply();
  typingRef.doc(username).delete().catch(()=>{});
  autoScroll = true;
  
  try {
    await groupRef.collection('messages').add(msgData);
  } catch (err) {
    console.error('Send failed:', err);
    alert('Message not sent');
  }
}

// --- PRESENCE & MEMBER LIST ---
async function updatePresence() {
  try {
    await presenceRef.doc(username).set({
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) { console.error("Presence update failed", e); }
}

function renderMemberList() {
  const listHtml = Object.keys(groupMembers).sort().map(user => {
    const member = groupMembers[user];
    const statusClass = member.online ? 'online' : '';
    const dn = member.displayName || user; 
    
    return `<div class="memberItem">
              <span class="statusCircle ${statusClass}"></span>
              <span>${dn}</span>
            </div>`;
  }).join('');
  
  const count = Object.keys(groupMembers).length;
  const countHtml = `<div style="margin-top:12px; font-weight:700">Members (${count})</div>`;

  const desktopList = document.getElementById('memberListDesktop');
  const mobileList = document.getElementById('memberListMobile');
  if (desktopList) desktopList.innerHTML = countHtml + listHtml;
  if (mobileList) mobileList.innerHTML = countHtml + listHtml;
}

function setupMemberListeners() {
  membersRef.onSnapshot(snap => {
    let updated = false;
    
    snap.forEach(doc => {
      const user = doc.id;
      const data = doc.data();
      
      if (!groupMembers[user] || groupMembers[user].displayName !== data.displayName) {
        groupMembers[user] = {
          ...groupMembers[user], 
          displayName: data.displayName
        };
        updated = true;
      }
    });

    if (updated) renderMemberList();
  });

  presenceRef.onSnapshot(snap => {
    const now = Date.now();
    const presenceCutoff = now - 60000;
    let updated = false;

    const onlineUsers = {};
    snap.forEach(doc => {
      const data = doc.data();
      if (data.ts) {
        const tsMillis = data.ts.toMillis ? data.ts.toMillis() : data.ts.seconds * 1000;
        if (tsMillis > presenceCutoff) {
          onlineUsers[doc.id] = true;
        }
      }
    });

    Object.keys(groupMembers).forEach(user => {
      const isOnline = !!onlineUsers[user];
      if (groupMembers[user].online !== isOnline) {
        groupMembers[user].online = isOnline;
        updated = true;
      }
    });
    
    Object.keys(onlineUsers).forEach(user => {
      if (!groupMembers[user]) {
        groupMembers[user] = { displayName: user, online: true };
        updated = true;
      }
    });

    if (updated) renderMemberList();
  });
}

// ---- Load group info ----
(async()=>{
  const snap = await groupRef.get();
  if(!snap.exists){ alert('Group not found'); window.location='app.html'; return; }
  const d = snap.data();
  groupName = d.name || '(no name)';
  
  const membersSnap = await membersRef.get();
  const displayNamesMap = {};
  membersSnap.forEach(doc => {
      const data = doc.data();
      if (data && data.displayName) {
          displayNamesMap[doc.id] = data.displayName;
      }
  });

  if (d.members && Array.isArray(d.members)) {
    d.members.forEach(user => {
      if (!groupMembers[user]) {
          groupMembers[user] = { 
            displayName: displayNamesMap[user] || user, 
            online: false 
          };
      }
    });
  }

  const groupHeaderHTML = `<div style="font-weight:700">${groupName}</div>
                            <div class="small">Owner: ${d.owner}</div>
                            <div id="memberListDesktop"></div>`;
  const groupHeaderHTMLMobile = `<div style="font-weight:700">${groupName}</div>
                                  <div class="small">Owner: ${d.owner}</div>
                                  <div id="memberListMobile"></div>`;

  document.getElementById('groupMeta').innerHTML = groupHeaderHTML;
  document.getElementById('groupMetaMobile').innerHTML = groupHeaderHTMLMobile;
  
  renderMemberList();

  await membersRef.doc(username).set({
    displayName: displayName
  }, { merge: true });

  setupMemberListeners();

  updatePresence(); 
  setInterval(updatePresence, 30000); 
})();
</script>
